plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jayathasoft.tcradios.wear'
    compileSdkVersion 36

    defaultConfig {
        applicationId 'com.jayathasoft.tcradios.wear'
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 18
        versionName '1.4.4'
    }

    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file('keystore.properties')
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                def releaseStorePassword = keystoreProperties['storePassword']
                if (releaseStorePassword && !releaseStorePassword.isEmpty()) {
                    storeFile file(keystoreProperties['storeFile'] ?: '../jayathasoft.keystore')
                    storePassword = releaseStorePassword
                    keyAlias = keystoreProperties['keyAlias'] ?: 'jayathasoft-keystore'
                    keyPassword = keystoreProperties['keyPassword'] ?: releaseStorePassword
                }
            } else {
                def releaseStorePassword = System.getenv('KEYSTORE_PASSWORD')
                if (releaseStorePassword && !releaseStorePassword.isEmpty()) {
                    storeFile file('../jayathasoft.keystore')
                    storePassword = releaseStorePassword
                    keyAlias = System.getenv('KEY_ALIAS') ?: 'jayathasoft-keystore'
                    keyPassword = System.getenv('KEY_PASSWORD') ?: releaseStorePassword
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storePassword) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.15.0'
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
