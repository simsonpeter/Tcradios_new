name: Build TCRadios phone + Wear release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x twa/gradlew

      - name: Build phone + Wear release APK/AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd twa
          ./gradlew \
            :app:assembleRelease \
            :app:bundleRelease \
            :wear:assembleRelease \
            :wear:bundleRelease \
            --no-daemon

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: TCRadios-phone-apk
          path: |
            twa/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload phone AAB
        uses: actions/upload-artifact@v4
        with:
          name: TCRadios-phone-aab
          path: |
            twa/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload Wear APK
        uses: actions/upload-artifact@v4
        with:
          name: TCRadios-wear-apk
          path: |
            twa/wear/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Wear AAB
        uses: actions/upload-artifact@v4
        with:
          name: TCRadios-wear-aab
          path: |
            twa/wear/build/outputs/bundle/release/*.aab
          if-no-files-found: error
