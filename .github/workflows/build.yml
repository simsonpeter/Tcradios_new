name: Build Bubblewrap TWA APK / AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x twa/gradlew

      # Single phone release package. Wear OS / Android Auto watch controls ship via
      # MediaSession in :app (no separate Wear APK/AAB artifact).
      - name: Build release APK/AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd twa
          ./gradlew \
            :app:assembleRelease \
            :app:bundleRelease \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TCRadios-release-apk
          path: |
            twa/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: TCRadios-release-aab
          path: |
            twa/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
